# Deploy web/ to GitHub Pages → https://standing.joelhanson.com
#
# Pages source MUST be "GitHub Actions" (not "Deploy from a branch").
# Branch deploy creates a second automatic workflow (pages-build-deployment)
# that publishes the whole repo and races this one.
#
# One-time (human):
#   1. Settings → Pages → Source: GitHub Actions
#   2. DNS CNAME: standing → Joel-hanson.github.io (Cloudflare: DNS only)
#   3. Pages → Custom domain: standing.joelhanson.com (Enforce HTTPS)
#
# Repo must be public (or GitHub Pro) for Pages on the free plan.

name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Build + smoke-test Standing on macOS for every push / PR.
# Matrix covers Apple Silicon and Intel. Does not publish (see release.yml).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    name: macOS smoke (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            os: macos-15
          - arch: x86_64
            os: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm runner arch
        run: |
          set -euo pipefail
          HOST="$(uname -m)"
          echo "host=$HOST expected=${{ matrix.arch }}"
          test "$HOST" = "${{ matrix.arch }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create .venv + install deps
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Smoke (imports, Standing.app, DMG)
        env:
          STANDING_SHIP_ARCH: ${{ matrix.arch }}
          # Full release embed is expensive; CI packs a thin release on schedule /
          # release.yml. Dev smoke is enough for every PR.
          STANDING_CI_RELEASE_SMOKE: "0"
        run: ./scripts/ci-smoke.sh

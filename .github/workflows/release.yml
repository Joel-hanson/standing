# Tag a version → build Standing.app per arch → DMG → GitHub Release.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Matrix:
#   arm64   → macos-15           → Standing-<ver>-arm64.dmg
#   x86_64  → macos-15-intel     → Standing-<ver>-x86_64.dmg
#
# Also uploads Standing-<ver>.dmg as a copy of the arm64 build for older links.
#
# Without Apple secrets: uploads unsigned (ad-hoc) DMGs — fine for testing,
# Gatekeeper will warn on other Macs.
#
# With secrets (Settings → Secrets and variables → Actions):
#   APPLE_CERTIFICATE_P12_BASE64   base64 of Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD     .p12 export password
#   APPLE_API_KEY_P8_BASE64        base64 of AuthKey_XXX.p8
#   APPLE_API_KEY_ID               App Store Connect key id
#   APPLE_API_ISSUER_ID            App Store Connect issuer UUID
# Optional Sparkle in-app updates:
#   SPARKLE_PRIVATE_ED_KEY         ed25519 private key (sign_update)
#   STANDING_SPARKLE_PUBLIC_ED_KEY public key baked into Info.plist
#   STANDING_SPARKLE_FEED_URL      HTTPS appcast URL (often GitHub Pages / release asset)

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v prefix (e.g. 0.2.0)"
        required: true
      build:
        description: "CFBundleVersion integer"
        required: true
        default: "1"

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      build: ${{ steps.ver.outputs.build }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
            BUILD="${{ inputs.build }}"
            TAG="v${VERSION}"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            BUILD="$(git rev-list --count HEAD)"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "Version must look like 0.2.0 (got: $VERSION)" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved $TAG (version=$VERSION build=$BUILD)"

  package:
    name: Package ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            os: macos-15
          - arch: x86_64
            os: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm runner arch
        run: |
          set -euo pipefail
          HOST="$(uname -m)"
          echo "host=$HOST expected=${{ matrix.arch }}"
          test "$HOST" = "${{ matrix.arch }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv (relocatable embed Python for release apps)
        run: |
          set -euo pipefail
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Create build venv (host tooling)
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Import Developer ID certificate
        id: cert
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${CERT_P12_BASE64:-}" ]]; then
            echo "signing=false" >> "$GITHUB_OUTPUT"
            echo "No APPLE_CERTIFICATE_P12_BASE64 — building unsigned DMG."
            exit 0
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/standing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERT_PATH="$RUNNER_TEMP/developer_id.p12"
          echo "$CERT_P12_BASE64" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # Intentionally unquoted: each keychain must be a separate arg.
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F'\"' '/Developer ID Application/{print $2; exit}')"
          if [[ -z "$IDENTITY" ]]; then
            echo "Could not find Developer ID Application identity in imported cert." >&2
            exit 1
          fi
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "signing=true" >> "$GITHUB_OUTPUT"
          echo "keychain=$KEYCHAIN_PATH" >> "$GITHUB_OUTPUT"
          echo "Using identity: $IDENTITY"
          rm -f "$CERT_PATH"

      - name: Package DMG
        env:
          STANDING_APP_VERSION: ${{ needs.version.outputs.version }}
          STANDING_APP_BUILD: ${{ needs.version.outputs.build }}
          STANDING_SHIP_ARCH: ${{ matrix.arch }}
          STANDING_SPARKLE_FEED_URL: ${{ secrets.STANDING_SPARKLE_FEED_URL }}
          STANDING_SPARKLE_PUBLIC_ED_KEY: ${{ secrets.STANDING_SPARKLE_PUBLIC_ED_KEY }}
        run: |
          set -euo pipefail
          chmod +x scripts/verify-release-payload.sh
          DMG="$(./scripts/package-dmg.sh)"
          echo "DMG_PATH=$DMG" >> "$GITHUB_ENV"
          ls -lh "$DMG"
          APP="$(pwd)/native/Standing/Standing.app"
          ./scripts/verify-release-payload.sh "$APP" "${{ matrix.arch }}"

      - name: Codesign app + DMG
        if: steps.cert.outputs.signing == 'true'
        env:
          IDENTITY: ${{ steps.cert.outputs.identity }}
          VERSION: ${{ needs.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          APP="native/Standing/Standing.app"
          ENTITLEMENTS="$RUNNER_TEMP/Standing.entitlements"
          python3 - <<'PY'
          from pathlib import Path
          import os
          Path(os.environ["RUNNER_TEMP"], "Standing.entitlements").write_text(
              '<?xml version="1.0" encoding="UTF-8"?>\n'
              '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" '
              '"http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n'
              '<plist version="1.0">\n'
              '<dict>\n'
              '  <key>com.apple.security.device.camera</key>\n'
              '  <true/>\n'
              '  <key>com.apple.security.cs.allow-unsigned-executable-memory</key>\n'
              '  <true/>\n'
              '  <key>com.apple.security.cs.disable-library-validation</key>\n'
              '  <true/>\n'
              '</dict>\n'
              '</plist>\n'
          )
          PY

          while IFS= read -r -d '' bin; do
            codesign --force --options runtime --timestamp \
              --sign "$IDENTITY" "$bin" || true
          done < <(find "$APP/Contents/Resources" -type f \( -perm +111 -o -name '*.dylib' -o -name '*.so' \) -print0 2>/dev/null)

          if [[ -d "$APP/Contents/Frameworks/Sparkle.framework" ]]; then
            codesign --force --options runtime --timestamp --sign "$IDENTITY" \
              "$APP/Contents/Frameworks/Sparkle.framework"
          fi

          codesign --force --options runtime --timestamp \
            --sign "$IDENTITY" --entitlements "$ENTITLEMENTS" \
            "$APP/Contents/MacOS/Standing"
          codesign --force --options runtime --timestamp \
            --sign "$IDENTITY" --entitlements "$ENTITLEMENTS" "$APP"
          codesign --verify --verbose=2 "$APP"

          STANDING_APP_VERSION="$VERSION" STANDING_SHIP_ARCH="$ARCH" \
            ./scripts/package-dmg.sh --skip-build
          DMG="dist/Standing-${VERSION}-${ARCH}.dmg"
          codesign --force --timestamp --sign "$IDENTITY" "$DMG"
          codesign --verify --verbose=2 "$DMG"
          echo "DMG_PATH=$DMG" >> "$GITHUB_ENV"

      - name: Notarize + staple
        if: steps.cert.outputs.signing == 'true'
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${API_KEY_P8_BASE64:-}" || -z "${API_KEY_ID:-}" || -z "${API_ISSUER_ID:-}" ]]; then
            echo "Signing secrets present but notarization secrets missing — skipping notarytool."
            exit 0
          fi
          KEY="$RUNNER_TEMP/AuthKey_${API_KEY_ID}.p8"
          echo "$API_KEY_P8_BASE64" | base64 --decode -o "$KEY"
          xcrun notarytool submit "$DMG_PATH" \
            --key "$KEY" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID" \
            --wait
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          rm -f "$KEY"

      - name: Sparkle sign_update
        id: sparkle
        env:
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p dist
          META="dist/sparkle-${ARCH}.json"
          if [[ -z "${SPARKLE_PRIVATE_ED_KEY:-}" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo '{"enabled":false}' > "$META"
            exit 0
          fi
          SIGN_UPDATE="$(find native/Standing/.build -path '*/bin/sign_update' -type f 2>/dev/null | head -1 || true)"
          if [[ -z "$SIGN_UPDATE" ]]; then
            echo "sign_update not found under .build — skip Sparkle signature."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo '{"enabled":false}' > "$META"
            exit 0
          fi
          KEY_FILE="$RUNNER_TEMP/sparkle_ed_key"
          printf '%s' "$SPARKLE_PRIVATE_ED_KEY" > "$KEY_FILE"
          OUT="$("$SIGN_UPDATE" "$DMG_PATH" -f "$KEY_FILE")"
          echo "$OUT"
          SIG="$(echo "$OUT" | sed -n 's/.*edSignature="\([^"]*\)".*/\1/p')"
          LEN="$(echo "$OUT" | sed -n 's/.*length="\([^"]*\)".*/\1/p')"
          if [[ -z "$SIG" || -z "$LEN" ]]; then
            SIG="$(echo "$OUT" | awk '/^[[:alnum:]+\/=]+$/{print; exit}')"
            LEN="$(stat -f%z "$DMG_PATH")"
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          ARCH="$ARCH" SIG="$SIG" LEN="$LEN" DMG_PATH="$DMG_PATH" META="$META" python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path(os.environ["META"]).write_text(json.dumps({
              "enabled": True,
              "arch": os.environ["ARCH"],
              "signature": os.environ["SIG"],
              "length": os.environ["LEN"],
              "dmg": Path(os.environ["DMG_PATH"]).name,
          }, indent=2))
          PY
          rm -f "$KEY_FILE"

      - name: Alias arm64 DMG for legacy download URL
        if: matrix.arch == 'arm64'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          cp "$DMG_PATH" "dist/Standing-${VERSION}.dmg"
          ls -lh "dist/Standing-${VERSION}.dmg"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: standing-${{ matrix.arch }}
          path: |
            dist/Standing-${{ needs.version.outputs.version }}-${{ matrix.arch }}.dmg
            dist/sparkle-${{ matrix.arch }}.json
          if-no-files-found: error

      - name: Upload legacy arm64 alias
        if: matrix.arch == 'arm64'
        uses: actions/upload-artifact@v4
        with:
          name: standing-arm64-legacy
          path: dist/Standing-${{ needs.version.outputs.version }}.dmg
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [version, package]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download arch artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: standing-*
          path: dist/artifacts
          merge-multiple: true

      - name: Assemble release files + appcast
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BUILD: ${{ needs.version.outputs.build }}
          TAG: ${{ needs.version.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # Flatten downloaded DMGs / JSON into dist/
          find dist/artifacts -type f \( -name '*.dmg' -o -name 'sparkle-*.json' \) -exec cp {} dist/ \;
          ls -lh dist/*.dmg dist/sparkle-*.json 2>/dev/null || ls -lhR dist

          test -f "dist/Standing-${VERSION}-arm64.dmg"
          test -f "dist/Standing-${VERSION}-x86_64.dmg"
          # Legacy URL without arch suffix (Apple Silicon).
          if [[ ! -f "dist/Standing-${VERSION}.dmg" ]]; then
            cp "dist/Standing-${VERSION}-arm64.dmg" "dist/Standing-${VERSION}.dmg"
          fi

          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          version = os.environ["VERSION"]
          build = os.environ["BUILD"]
          tag = os.environ["TAG"]
          repo = os.environ["REPO"]
          pubdate = datetime.now(timezone.utc).strftime("%a, %d %b %Y %H:%M:%S +0000")
          dist = Path("dist")

          enclosures = []
          for arch in ("arm64", "x86_64"):
              meta_path = dist / f"sparkle-{arch}.json"
              dmg_name = f"Standing-{version}-{arch}.dmg"
              dmg = dist / dmg_name
              if not dmg.is_file():
                  raise SystemExit(f"missing {dmg}")
              meta = {"enabled": False}
              if meta_path.is_file():
                  meta = json.loads(meta_path.read_text())
              url = f"https://github.com/{repo}/releases/download/{tag}/{dmg_name}"
              if meta.get("enabled") and meta.get("signature") and meta.get("length"):
                  enclosures.append(
                      f"""    <enclosure
              url="{url}"
              sparkle:edSignature="{meta['signature']}"
              sparkle:version="{build}"
              sparkle:shortVersionString="{version}"
              sparkle:os="macos"
              sparkle:arch="{arch}"
              length="{meta['length']}"
              type="application/octet-stream"
            />"""
                  )
              else:
                  # Unsigned / no Sparkle key — still document the asset in release notes body.
                  print(f"Sparkle skipped for {arch}", flush=True)

          # Legacy enclosure (arm64, no arch attribute) when signed.
          arm_meta_path = dist / "sparkle-arm64.json"
          if arm_meta_path.is_file():
              arm = json.loads(arm_meta_path.read_text())
              if arm.get("enabled") and arm.get("signature") and arm.get("length"):
                  legacy = f"Standing-{version}.dmg"
                  enclosures.insert(
                      0,
                      f"""    <enclosure
              url="https://github.com/{repo}/releases/download/{tag}/{legacy}"
              sparkle:edSignature="{arm['signature']}"
              sparkle:version="{build}"
              sparkle:shortVersionString="{version}"
              sparkle:os="macos"
              length="{arm['length']}"
              type="application/octet-stream"
            />""",
                  )

          if enclosures:
              item = f"""  <item>
            <title>Version {version}</title>
            <pubDate>{pubdate}</pubDate>
            <sparkle:version>{build}</sparkle:version>
            <sparkle:shortVersionString>{version}</sparkle:shortVersionString>
          {chr(10).join(enclosures)}
          </item>
          """
              (dist / "appcast-item.xml").write_text(item)
              (dist / "appcast.xml").write_text(
                  '<?xml version="1.0" encoding="utf-8"?>\n'
                  '<rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">\n'
                  '  <channel>\n'
                  '    <title>Standing</title>\n'
                  '    <language>en</language>\n'
                  f'{item}'
                  '  </channel>\n'
                  '</rss>\n'
              )
              print("Wrote appcast.xml")
          else:
              print("No Sparkle signatures — skipping appcast.xml")
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Standing ${{ needs.version.outputs.version }}
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            ## Downloads
            - **Apple Silicon (arm64):** `Standing-${{ needs.version.outputs.version }}-arm64.dmg` (also `Standing-${{ needs.version.outputs.version }}.dmg`)
            - **Intel (x86_64):** `Standing-${{ needs.version.outputs.version }}-x86_64.dmg`

            Each DMG embeds a matching relocatable Python runtime — no Python install required.
          files: |
            dist/Standing-${{ needs.version.outputs.version }}-arm64.dmg
            dist/Standing-${{ needs.version.outputs.version }}-x86_64.dmg
            dist/Standing-${{ needs.version.outputs.version }}.dmg
            dist/appcast.xml
            dist/appcast-item.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

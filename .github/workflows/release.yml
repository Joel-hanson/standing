# Tag a version → build Standing.app → DMG → GitHub Release.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Without Apple secrets: uploads an unsigned (ad-hoc) DMG — fine for testing,
# Gatekeeper will warn on other Macs.
#
# With secrets (Settings → Secrets and variables → Actions):
#   APPLE_CERTIFICATE_P12_BASE64   base64 of Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD     .p12 export password
#   APPLE_API_KEY_P8_BASE64        base64 of AuthKey_XXX.p8
#   APPLE_API_KEY_ID               App Store Connect key id
#   APPLE_API_ISSUER_ID            App Store Connect issuer UUID
# Optional Sparkle in-app updates:
#   SPARKLE_PRIVATE_ED_KEY         ed25519 private key (sign_update)
#   STANDING_SPARKLE_PUBLIC_ED_KEY public key baked into Info.plist
#   STANDING_SPARKLE_FEED_URL      HTTPS appcast URL (often GitHub Pages / release asset)

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v prefix (e.g. 0.2.0)"
        required: true
      build:
        description: "CFBundleVersion integer"
        required: true
        default: "1"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
            BUILD="${{ inputs.build }}"
            TAG="v${VERSION}"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            # Build number = commits on main (stable-ish) unless overridden later.
            BUILD="$(git rev-list --count HEAD)"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "Version must look like 0.2.0 (got: $VERSION)" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved $TAG (version=$VERSION build=$BUILD)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create build venv (host tooling)
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Import Developer ID certificate
        id: cert
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${CERT_P12_BASE64:-}" ]]; then
            echo "signing=false" >> "$GITHUB_OUTPUT"
            echo "No APPLE_CERTIFICATE_P12_BASE64 — building unsigned DMG."
            exit 0
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/standing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERT_PATH="$RUNNER_TEMP/developer_id.p12"
          echo "$CERT_P12_BASE64" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # Intentionally unquoted: each keychain must be a separate arg.
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F'\"' '/Developer ID Application/{print $2; exit}')"
          if [[ -z "$IDENTITY" ]]; then
            echo "Could not find Developer ID Application identity in imported cert." >&2
            exit 1
          fi
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "signing=true" >> "$GITHUB_OUTPUT"
          echo "keychain=$KEYCHAIN_PATH" >> "$GITHUB_OUTPUT"
          echo "Using identity: $IDENTITY"
          rm -f "$CERT_PATH"

      - name: Package DMG
        env:
          STANDING_APP_VERSION: ${{ steps.ver.outputs.version }}
          STANDING_APP_BUILD: ${{ steps.ver.outputs.build }}
          STANDING_SPARKLE_FEED_URL: ${{ secrets.STANDING_SPARKLE_FEED_URL }}
          STANDING_SPARKLE_PUBLIC_ED_KEY: ${{ secrets.STANDING_SPARKLE_PUBLIC_ED_KEY }}
        run: |
          set -euo pipefail
          DMG="$(./scripts/package-dmg.sh)"
          echo "DMG_PATH=$DMG" >> "$GITHUB_ENV"
          ls -lh "$DMG"

      - name: Codesign app + DMG
        if: steps.cert.outputs.signing == 'true'
        env:
          IDENTITY: ${{ steps.cert.outputs.identity }}
        run: |
          set -euo pipefail
          APP="native/Standing/Standing.app"
          ENTITLEMENTS="$RUNNER_TEMP/Standing.entitlements"
          python3 - <<'PY'
          from pathlib import Path
          import os
          Path(os.environ["RUNNER_TEMP"], "Standing.entitlements").write_text(
              '<?xml version="1.0" encoding="UTF-8"?>\n'
              '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" '
              '"http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n'
              '<plist version="1.0">\n'
              '<dict>\n'
              '  <key>com.apple.security.device.camera</key>\n'
              '  <true/>\n'
              '  <key>com.apple.security.cs.allow-unsigned-executable-memory</key>\n'
              '  <true/>\n'
              '  <key>com.apple.security.cs.disable-library-validation</key>\n'
              '  <true/>\n'
              '  <key>com.apple.developer.healthkit</key>\n'
              '  <true/>\n'
              '</dict>\n'
              '</plist>\n'
          )
          PY

          # Sign nested Mach-O deepest-first, then frameworks, then the app.
          while IFS= read -r -d '' bin; do
            codesign --force --options runtime --timestamp \
              --sign "$IDENTITY" "$bin" || true
          done < <(find "$APP/Contents/Resources" -type f \( -perm +111 -o -name '*.dylib' -o -name '*.so' \) -print0 2>/dev/null)

          if [[ -d "$APP/Contents/Frameworks/Sparkle.framework" ]]; then
            codesign --force --options runtime --timestamp --sign "$IDENTITY" \
              "$APP/Contents/Frameworks/Sparkle.framework"
          fi

          codesign --force --options runtime --timestamp \
            --sign "$IDENTITY" --entitlements "$ENTITLEMENTS" \
            "$APP/Contents/MacOS/Standing"
          codesign --force --options runtime --timestamp \
            --sign "$IDENTITY" --entitlements "$ENTITLEMENTS" "$APP"
          codesign --verify --verbose=2 "$APP"

          # Rebuild DMG from the signed app, then sign the disk image.
          STANDING_APP_VERSION="${{ steps.ver.outputs.version }}" \
            ./scripts/package-dmg.sh --skip-build
          DMG="dist/Standing-${{ steps.ver.outputs.version }}.dmg"
          codesign --force --timestamp --sign "$IDENTITY" "$DMG"
          codesign --verify --verbose=2 "$DMG"
          echo "DMG_PATH=$DMG" >> "$GITHUB_ENV"

      - name: Notarize + staple
        if: steps.cert.outputs.signing == 'true'
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${API_KEY_P8_BASE64:-}" || -z "${API_KEY_ID:-}" || -z "${API_ISSUER_ID:-}" ]]; then
            echo "Signing secrets present but notarization secrets missing — skipping notarytool."
            exit 0
          fi
          KEY="$RUNNER_TEMP/AuthKey_${API_KEY_ID}.p8"
          echo "$API_KEY_P8_BASE64" | base64 --decode -o "$KEY"
          xcrun notarytool submit "$DMG_PATH" \
            --key "$KEY" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID" \
            --wait
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          rm -f "$KEY"

      - name: Sparkle sign_update
        id: sparkle
        env:
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${SPARKLE_PRIVATE_ED_KEY:-}" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SIGN_UPDATE="$(find native/Standing/.build -path '*/bin/sign_update' -type f 2>/dev/null | head -1 || true)"
          if [[ -z "$SIGN_UPDATE" ]]; then
            echo "sign_update not found under .build — skip Sparkle signature."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEY_FILE="$RUNNER_TEMP/sparkle_ed_key"
          printf '%s' "$SPARKLE_PRIVATE_ED_KEY" > "$KEY_FILE"
          # sign_update prints: sparkle:edSignature="..." length="..."
          OUT="$("$SIGN_UPDATE" "$DMG_PATH" -f "$KEY_FILE")"
          echo "$OUT"
          SIG="$(echo "$OUT" | sed -n 's/.*edSignature="\([^"]*\)".*/\1/p')"
          LEN="$(echo "$OUT" | sed -n 's/.*length="\([^"]*\)".*/\1/p')"
          if [[ -z "$SIG" || -z "$LEN" ]]; then
            # Newer sparkle may print "signature length" on two lines
            SIG="$(echo "$OUT" | awk '/^[[:alnum:]+\/=]+$/{print; exit}')"
            LEN="$(stat -f%z "$DMG_PATH")"
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "signature=$SIG" >> "$GITHUB_OUTPUT"
          echo "length=$LEN" >> "$GITHUB_OUTPUT"
          rm -f "$KEY_FILE"

      - name: Generate appcast item
        if: steps.sparkle.outputs.enabled == 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          BUILD: ${{ steps.ver.outputs.build }}
          SIG: ${{ steps.sparkle.outputs.signature }}
          LEN: ${{ steps.sparkle.outputs.length }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          export PUBDATE
          PUBDATE="$(date -u '+%a, %d %b %Y %H:%M:%S +0000')"
          export URL="https://github.com/${REPO}/releases/download/${TAG}/Standing-${VERSION}.dmg"
          mkdir -p dist
          python3 - <<'PY'
          from pathlib import Path
          import os
          item = f"""<item>
            <title>Version {os.environ['VERSION']}</title>
            <pubDate>{os.environ['PUBDATE']}</pubDate>
            <sparkle:version>{os.environ['BUILD']}</sparkle:version>
            <sparkle:shortVersionString>{os.environ['VERSION']}</sparkle:shortVersionString>
            <enclosure
              url="{os.environ['URL']}"
              sparkle:edSignature="{os.environ['SIG']}"
              length="{os.environ['LEN']}"
              type="application/octet-stream"
            />
          </item>
          """
          Path("dist/appcast-item.xml").write_text(item)
          Path("dist/appcast.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">\n'
              '  <channel>\n'
              '    <title>Standing</title>\n'
              '    <language>en</language>\n'
              f'{item}'
              '  </channel>\n'
              '</rss>\n'
          )
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Standing ${{ steps.ver.outputs.version }}
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            ${{ env.DMG_PATH }}
            dist/appcast.xml
            dist/appcast-item.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
